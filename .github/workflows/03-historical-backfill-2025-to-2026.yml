name: 03 - Historical Backfill 2025 to May 2026
run-name: Historical floorsheet backfill - 2025-01 to 2026-05

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ne-fl-sheet-download
  cancel-in-progress: false

jobs:
  monthly-backfill:
    name: Download ${{ matrix.period.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        period:
          - { label: "2025-01", start: "2025-01-01", end: "2025-01-31" }
          - { label: "2025-02", start: "2025-02-01", end: "2025-02-28" }
          - { label: "2025-03", start: "2025-03-01", end: "2025-03-31" }
          - { label: "2025-04", start: "2025-04-01", end: "2025-04-30" }
          - { label: "2025-05", start: "2025-05-01", end: "2025-05-31" }
          - { label: "2025-06", start: "2025-06-01", end: "2025-06-30" }
          - { label: "2025-07", start: "2025-07-01", end: "2025-07-31" }
          - { label: "2025-08", start: "2025-08-01", end: "2025-08-31" }
          - { label: "2025-09", start: "2025-09-01", end: "2025-09-30" }
          - { label: "2025-10", start: "2025-10-01", end: "2025-10-31" }
          - { label: "2025-11", start: "2025-11-01", end: "2025-11-30" }
          - { label: "2025-12", start: "2025-12-01", end: "2025-12-31" }
          - { label: "2026-01", start: "2026-01-01", end: "2026-01-31" }
          - { label: "2026-02", start: "2026-02-01", end: "2026-02-28" }
          - { label: "2026-03", start: "2026-03-01", end: "2026-03-31" }
          - { label: "2026-04", start: "2026-04-01", end: "2026-04-30" }
          - { label: "2026-05", start: "2026-05-01", end: "2026-05-31" }

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install required packages
        run: python -m pip install --requirement requirements.txt

      - name: Check files and run validation tests
        run: |
          python -m py_compile floorsheet_downloader.py
          python -m unittest discover -s tests -v

      - name: Download and validate the month
        id: download
        continue-on-error: true
        run: >-
          python floorsheet_downloader.py
          --start-date "${{ matrix.period.start }}"
          --end-date "${{ matrix.period.end }}"
          --output-dir output
          --delay 0.8

      - name: Verify that monthly reports were created
        if: always()
        run: |
          test -f output/quality_report.csv
          test -f output/validation_summary.json
          test -f output/logs/downloader.log

      - name: Save the monthly result for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floorsheets-${{ matrix.period.label }}
          path: output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
