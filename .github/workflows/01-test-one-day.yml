name: 01 - Test One Trading Day

on:
  workflow_dispatch:
    inputs:
      test_date:
        description: "Trading date in YYYY-MM-DD format"
        required: true
        default: "2026-08-21"
        type: string

permissions:
  contents: read

concurrency:
  group: ne-fl-sheet-download
  cancel-in-progress: false

jobs:
  test-one-day:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TEST_DATE: ${{ inputs.test_date }}

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install required packages
        run: python -m pip install --requirement requirements.txt

      - name: Check Python file
        run: python -m py_compile floorsheet_downloader.py

      - name: Run built-in validation tests
        run: python -m unittest discover -s tests -v

      - name: Download and validate the selected day
        run: >-
          python floorsheet_downloader.py
          --start-date "$TEST_DATE"
          --end-date "$TEST_DATE"
          --output-dir output
          --delay 0.8

      - name: Save test result for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floorsheet-test-${{ inputs.test_date }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
