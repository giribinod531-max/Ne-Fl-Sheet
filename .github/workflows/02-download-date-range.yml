name: 02 - Download Date Range
run-name: Floorsheets ${{ inputs.start_date }} to ${{ inputs.end_date }}

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date in YYYY-MM-DD format"
        required: true
        default: "2026-07-01"
        type: string
      end_date:
        description: "End date in YYYY-MM-DD format (maximum 31 calendar days)"
        required: true
        default: "2026-07-31"
        type: string

permissions:
  contents: read

concurrency:
  group: ne-fl-sheet-download
  cancel-in-progress: false

jobs:
  download-date-range:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install required packages
        run: python -m pip install --requirement requirements.txt

      - name: Check files and run validation tests
        run: |
          python -m py_compile floorsheet_downloader.py
          python -m unittest discover -s tests -v

      - name: Validate the requested date range
        run: |
          python - <<'PY'
          import os
          from datetime import date

          try:
              start = date.fromisoformat(os.environ["START_DATE"])
              end = date.fromisoformat(os.environ["END_DATE"])
          except ValueError as exc:
              raise SystemExit("Dates must use YYYY-MM-DD format.") from exc

          days = (end - start).days + 1
          if days < 1:
              raise SystemExit("End date cannot be before start date.")
          if days > 31:
              raise SystemExit(
                  f"Requested {days} calendar days. Run no more than 31 days at a time."
              )
          print(f"Validated {days} calendar days: {start} to {end}")
          PY

      - name: Download and validate every date
        run: >-
          python floorsheet_downloader.py
          --start-date "$START_DATE"
          --end-date "$END_DATE"
          --output-dir output
          --delay 0.8

      - name: Save the date-range result for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floorsheets-${{ inputs.start_date }}-to-${{ inputs.end_date }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
